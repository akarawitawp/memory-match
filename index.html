<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match V2</title><style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f3f5fa;color:#222a40;margin:0;padding:16px}main{max-width:850px;margin:auto}h1{text-align:center;margin:10px}p{text-align:center}.panel{background:white;border-radius:16px;padding:16px;margin:15px 0;box-shadow:0 3px 15px #1b245014}.settings{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.settings label{display:flex;flex-direction:column;gap:5px}select,input,button{font:inherit;padding:9px;border:1px solid #c5cde0;border-radius:9px}button{cursor:pointer;background:#fff}button.primary{background:#2e4ac4;color:white}button:disabled{opacity:.65;cursor:default}.hidden{display:none!important}.names{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.names input{width:150px}.scores{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.score{border-radius:9px;background:#eef1fa;padding:9px}.score.active{outline:3px solid #2e4ac4}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.card{min-width:0;min-height:90px;background:#354ab0;color:white;font-size:clamp(23px,5vw,36px);font-weight:700;overflow-wrap:anywhere;padding:4px}.card.revealed{background:#fff;color:#1d2c48}.card.matched{background:#c4eed4;color:#1d2c48}.hanzi{display:block;font-size:clamp(22px,5vw,38px)}.pinyin,.english{display:block;font-size:clamp(10px,2.1vw,14px);font-weight:400}#status{font-weight:700;min-height:26px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px}footer{text-align:center;font-size:13px;color:#626a7a}@media(min-width:650px){.board{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:430px){.card{min-height:77px}}
</style></head><body><main><h1>🧠 Memory Match V2</h1><p>เกมจับคู่ภาพและคำศัพท์จีน • เล่นบนเครื่องเดียว</p><section class="panel"><div class="settings"><label>โหมด<select id="mode"><option value="icons">🍎 ผลไม้และรถ</option><option value="hsk">🇨🇳 HSK 1</option></select></label><label id="iconTypeLabel">หมวดไอคอน<select id="iconType"><option value="mixed">ผสม</option><option value="fruit">ผลไม้</option><option value="car">รถ</option></select></label><label>ผู้เล่น<select id="playerCount"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>จำนวนคู่<select id="pairCount"><option>8</option><option selected>10</option><option>20</option></select></label><label>เวลา<select id="minutes"><option>5</option><option selected>10</option><option>20</option></select></label></div><div id="names" class="names"></div><label id="voiceSetting"><input type="checkbox" id="voiceOn" checked> 🔊 อ่านคำศัพท์จีนอัตโนมัติ</label><button class="primary" id="newGame">เริ่มเกม / สุ่มชุดใหม่</button></section><section class="panel"><p>⏱ <b id="clock">00:00</b>　❌ พลาด <b id="errors">0</b></p><div id="scores" class="scores"></div><div class="actions" id="voiceActions"><button id="repeatVoice" disabled>🔊 ฟังคำล่าสุดอีกครั้ง</button></div><p id="status" aria-live="polite">เลือกการตั้งค่าแล้วกดเริ่มเกม</p><div id="board" class="board"></div><div id="endActions" class="actions hidden"><button id="replay">🔁 เล่นชุดเดิม (สลับตำแหน่ง)</button><button class="primary" id="fresh">🎲 สุ่มชุดใหม่</button></div></section><footer>ไม่ต้องติดตั้งแพ็กเกจหรือเชื่อมต่ออินเทอร์เน็ต • ไม่มีภาพไฟล์ ใช้ Emoji</footer></main><script src="hsk1.js"></script><script src="script.js"></script></body></html>
